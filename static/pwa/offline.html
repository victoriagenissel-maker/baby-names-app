<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7faf9;
      color: #0f172a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      padding: 24px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
    }
    h1 {
      margin-top: 0;
      font-size: 26px;
    }
    p {
      margin-bottom: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Reconnect to continue swiping names and syncing matches.</p>
  </div>
</body>
</html>
